version: "3.7"
services:

## --------------------------- ORION --------------------------- ##

  typebot_builder:
    image: baptistearno/typebot-builder:3.9.0 ## Versão do Builder do Typebot

    networks:
      - principal ## Nome da rede interna
    ports:
     - 9001:3000
    environment:
      ## Dados do Postgres
      - DATABASE_URL=postgresql://postgres:a9022987d6d0819b7707a9cef2f1f5db@postgres:5432/typebot

      ## Encryption key
      - ENCRYPTION_SECRET=e7de5amjdifh16b4522500ffa42780e2e39e7bs8
      - AUTH_TRUST_HOST=https://typebot.conext.net.ve

      ## Plano Padrão (das novas contas)
      - DEFAULT_WORKSPACE_PLAN=UNLIMITED

      ## Urls do typebot
      - NEXTAUTH_URL=https://typebot.conext.net.ve ## URL Builder
      - NEXT_PUBLIC_VIEWER_URL=https://typebotv.conext.net.ve ## URL Viewer
      - NEXTAUTH_URL_INTERNAL=http://localhost:3000

      ## Desativer/ativar novos cadastros
      - DISABLE_SIGNUP=false

      ## Dados do SMTP
      - ADMIN_EMAIL=cesar.sanchez@test.com.ve ## Email SMTP
      - NEXT_PUBLIC_SMTP_FROM='Suporte cesar.sanchez@test.com.ve'
      - SMTP_AUTH_DISABLED=false
      - SMTP_USERNAME=cesar.sanchez@test.com.ve
      - SMTP_PASSWORD=xxxxxxxxx
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_SECURE=true

      ## Dados Google Cloud
      - GOOGLE_AUTH_CLIENT_ID=xxxxxxxxxxxxx
      #- GOOGLE_SHEETS_CLIENT_ID=
      - GOOGLE_AUTH_CLIENT_SECRET=xxxxxxxxxxxxx
      #- GOOGLE_SHEETS_CLIENT_SECRET=
      #- NEXT_PUBLIC_GOOGLE_SHEETS_API_KEY=

      ## Dados do Minio/S3
      # - S3_ACCESS_KEY=$S3_ACCESS_KEY
      # - S3_SECRET_KEY=$S3_SECRET_KEY
      # - S3_BUCKET=typebot${1:+-$1}
      # - S3_ENDPOINT=$url_s3

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      # labels:
      #   - io.portainer.accesscontrol.users=admin
      #   - traefik.enable=true
      #   - traefik.http.routers.typebot${1:+_$1}_builder.rule=Host(\`$url_typebot\`) ## Url do Builder do Typebot
      #   - traefik.http.routers.typebot${1:+_$1}_builder.entrypoints=websecure
      #   - traefik.http.routers.typebot${1:+_$1}_builder.tls.certresolver=letsencryptresolver
      #   - traefik.http.services.typebot${1:+_$1}_builder.loadbalancer.server.port=3000
      #   - traefik.http.services.typebot${1:+_$1}_builder.loadbalancer.passHostHeader=true
      #   - traefik.http.routers.typebot${1:+_$1}_builder.service=typebot${1:+_$1}_builder

## --------------------------- ORION --------------------------- ##

  typebot_viewer:
    image: baptistearno/typebot-viewer:3.9.0 ## Versão do Viewer do Typebot

    networks:
      - principal ## Nome da rede interna
    ports:
     - 9002:3000
    environment:
