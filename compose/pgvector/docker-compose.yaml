version: "3.7"
services:

## --------------------------- ORION --------------------------- ##

  pgvector:
    image: pgvector/pgvector:pg16 ## Versão do PgVector
    container_name: ${CONTAINER_NAME} ## Nome do container
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=500
      -c shared_buffers=512MB

    volumes:
      - pgvector:/var/lib/postgresql/data

    # networks:
    #   - principal ## Nome da rede interna

    ## Descomente as linhas abaixo para uso externo
    #ports:
    #  - 5433:5432

    environment:
      ## Senha do postgres 
      - POSTGRES_PASSWORD=${DB_PASSWORD}

      ## Timezone
      - TZ=America/Caracas

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

## --------------------------- ORION --------------------------- ##

volumes:
  pgvector:
    #external: true
    name: pgvector

networks:
  ${RED_NAME}: ## Nome da rede interna
    #external: true
    name: ${RED_NAME} ## Nome da rede interna
